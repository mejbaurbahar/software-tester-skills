name: Installer or command bug
description: install.sh or a slash command does not work in your tool
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes: { label: Tool, options: [Claude Code, Antigravity, Gemini CLI, Codex, Cursor, Other] }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: OS, shell and tool version }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Command you ran and the output (use --dry-run first if unsure) }
    validations: { required: true }
